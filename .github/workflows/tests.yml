name: "Lint & Test PR"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: "Pint, Rector & Test with coverage (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.4, 8.5 ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: "Check PR title"
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, dom, curl, libxml, mbstring
          coverage: xdebug

      - name: "Install Composer Dependencies"
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-ansi --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: "Run Rector"
        run: |
          ./vendor/bin/rector process --dry-run --config=rector.php

      - name: "Run Pint"
        run: |
          ./vendor/bin/pint --config=pint.json --test --verbose

      - name: "Run Tests"
        run: |
          ./vendor/bin/pest --colors=always --stop-on-failure --coverage --ci
